<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOAT board &middot; The Cheezeyverse</title>
<meta name="description" content="The Cheezeyverse GOAT board: peak, career, rings and awards, with a formula you can move.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F1E4CB'/%3E%3Cpath d='M4 24 L28 24 L28 13 L4 21 Z' fill='%23D0843A'/%3E%3Ccircle cx='13' cy='21' r='1.8' fill='%23F1E4CB'/%3E%3Ccircle cx='21' cy='19' r='2.2' fill='%23F1E4CB'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="css/cheezey.css">
<script src="config.js"></script>
</head>
<body>

<main class="cv-page">

  <div class="cv-page-head">
    <h1>The GOAT board</h1>
    <div class="cv-seg" role="tablist" aria-label="League" id="switch"></div>
    <p class="cv-muted" id="intro">Peak, career, rings and awards - and who carried whom. Move the
      formula and the board re-ranks.</p>
  </div>

  <div id="notices"></div>

  <div class="cv-split cv-goat-layout">
    <section class="cv-card">
      <div class="cv-card-head">
        <h2>Greatest of all time</h2>
        <label class="cv-inline-check"><input type="checkbox" id="only-ours"> Real players only</label>
      </div>
      <div id="goat"><p class="cv-spinner">Working out the greats...</p></div>
    </section>

    <aside class="cv-card cv-formula">
      <div class="cv-card-head">
        <h2>Your formula</h2>
      </div>
      <div id="formula"><p class="cv-spinner">Loading the weights...</p></div>
    </aside>
  </div>

</main>

<script type="module" src="js/page-goat-board.js"></script>
</body>
</html>
