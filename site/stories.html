<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stories &middot; The Cheezeyverse</title>
<meta name="description" content="Career highs, streaks, awards, trades, playoff runs and rivalries from across the Cheezeyverse.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F1E4CB'/%3E%3Cpath d='M4 24 L28 24 L28 13 L4 21 Z' fill='%23D0843A'/%3E%3Ccircle cx='13' cy='21' r='1.8' fill='%23F1E4CB'/%3E%3Ccircle cx='21' cy='19' r='2.2' fill='%23F1E4CB'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="css/cheezey.css">
<script src="config.js"></script>
</head>
<body>
<main class="cv-page">
  <section class="cv-hero cv-cheese">
    <h1>Stories from the universe</h1>
    <p>Career nights, heaters, slumps, ugly tape, trades, awards, playoff runs and rivalries.
      Every entry comes from the game&rsquo;s published record.</p>
  </section>
  <div id="notices"></div>
  <section class="cv-card cv-story-controls" aria-labelledby="filter-title">
    <div class="cv-card-head"><h2 id="filter-title">Find a story</h2><span class="cv-muted" id="count"></span></div>
    <div class="cv-fields">
      <label><span>Player</span><select id="player" class="cv-select"><option value="">Everybody</option></select></label>
      <label><span>Story</span><select id="type" class="cv-select"><option value="">Everything</option></select></label>
      <label><span>Season</span><select id="season" class="cv-select"><option value="">Every season</option></select></label>
    </div>
  </section>
  <p class="cv-spinner" id="loading">Reading the record...</p>
  <div id="stories" class="cv-story-list"></div>
</main>
<script type="module" src="js/page-stories.js"></script>
</body>
</html>
