<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="Your Cheezeyverse characters: ratings, points available, and where the skill points went.">

<main class="cv-page">

  <h1>My players</h1>
  <p class="cv-muted" id="intro">Everything you own, everything you have banked, and everything you have asked for.</p>

  <div id="notices"></div>

  <div id="gate" hidden>
    <div class="cv-card">
      <h2>Sign in first</h2>
      <p>Your players are tied to your Discord account.</p>
      <div class="cv-actions">
        <button class="cv-btn cv-big" type="button" id="signin">Sign in with Discord</button>
      </div>
    </div>
  </div>

  <div id="characters"><p class="cv-spinner" id="loading" hidden>Loading your players...</p></div>

</main>

<script type="module" src="js/page-me.js"></script>
